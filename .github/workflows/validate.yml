name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate repository structure
        run: bash scripts/validate.sh
      - name: Check Bash syntax
        run: bash -n scripts/*.sh
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error $_.Message } }
          }
          if ($errors) { exit 1 }
      - name: Run Godot prototype headlessly
        run: |
          curl -fsSL --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path examples/godot/project --quit-after 2
